[package]
name = "wawona-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wawona Terminal. VT screen and UniFFI session. Hosts draw the cells."
repository = "https://github.com/Wawona/Terminal"
rust-version = "1.75"

[lib]
name = "wawona_terminal"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.30"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
png = "0.17.16"
